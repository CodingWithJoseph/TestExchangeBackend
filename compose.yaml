services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testexchange
      POSTGRES_USER: testexchange
      POSTGRES_PASSWORD: testexchange
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testexchange"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - testexchange-postgres:/var/lib/postgresql/data

volumes:
  testexchange-postgres:
