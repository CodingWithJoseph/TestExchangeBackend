name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testexchange
          POSTGRES_USER: testexchange
          POSTGRES_PASSWORD: testexchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testexchange -d testexchange"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.2"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pip-audit
      - run: pytest --ignore=tests/test_postgres_concurrency.py --cov=app --cov-report=term-missing
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://testexchange:testexchange@127.0.0.1:5432/testexchange
      - run: pytest tests/test_postgres_concurrency.py
        env:
          TEST_DATABASE_URL: postgresql://testexchange:testexchange@127.0.0.1:5432/testexchange
      - name: Test database backup restoration
        env:
          DATABASE_URL: postgresql://testexchange:testexchange@127.0.0.1:5432/testexchange
          ADMIN_DATABASE_URL: postgresql://testexchange:testexchange@127.0.0.1:5432/postgres
          RESTORE_DATABASE_URL: postgresql://testexchange:testexchange@127.0.0.1:5432/testexchange_restore
          RESTORE_DATABASE_NAME: testexchange_restore
          BACKUP_DIR: ${{ runner.temp }}/testexchange-backups
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          bash scripts/test_backup_restore.sh
      - run: alembic downgrade base
        env:
          DATABASE_URL: postgresql://testexchange:testexchange@127.0.0.1:5432/testexchange
